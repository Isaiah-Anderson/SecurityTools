name: Run Enumeration Script

on:
  workflow_dispatch:   # adds a "Run workflow" button
  push:                # also runs every time you push code

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run script
        shell: bash
        run: printf "1\nn\n" | python enumerate.py
